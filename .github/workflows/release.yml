# Rezuscloud fork release — builds the daprd sidecar image on every -rezus.N tag.
#
# Tag-driven (v<upstream-version>-rezus.<N>, cut by fork-maintenance's auto-release
# or manually). Multi-arch (amd64 + arm64) via per-arch go build + docker manifest.
# Pushes to ghcr.io/rezuscloud/daprd (org-owned package; GITHUB_TOKEN has
# packages:write). Flux consumes the versioned, digest-pinned tag — no mutable
# 'latest'.
#
# The daprd runtime is the only binary the sidecar image needs, but we build the
# full cmd/ set (make build-linux) to match upstream's image layout; the distroless
# base + docker/Dockerfile COPY the release dir verbatim.
name: release
on:
  push:
    tags:
      - "v*-rezus.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (must already exist)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build linux/${{ matrix.goarch }} binaries
        run: make build-linux GOARCH=${{ matrix.goarch }}

      - name: Verify daprd binary built
        run: test -x dist/linux_${{ matrix.goarch }}/release/daprd

      - name: Docker build + push (per-arch)
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          IMAGE="ghcr.io/rezuscloud/daprd"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build \
            --build-arg PKG_FILES=dist/linux_${{ matrix.goarch }}/release \
            -f docker/Dockerfile \
            -t "${IMAGE}:${TAG}-${{ matrix.goarch }}" .
          docker push "${IMAGE}:${TAG}-${{ matrix.goarch }}"

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          IMAGE="ghcr.io/rezuscloud/daprd"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker manifest create "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
          docker manifest push "${IMAGE}:${TAG}"
          echo "Released ${IMAGE}:${TAG} (multi-arch amd64+arm64)"
