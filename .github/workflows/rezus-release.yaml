name: rezus-release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-rezus.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., v1.18.0-rezus.1)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build and push (${{ matrix.target_os }}/${{ matrix.target_arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target_os: linux
            target_arch: amd64
          - target_os: linux
            target_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Go mod tidy
        run: go mod tidy

      - name: Build linux binaries
        env:
          GOOS: ${{ matrix.target_os }}
          GOARCH: ${{ matrix.target_arch }}
        run: make build-linux

      - name: Build and push Docker images
        env:
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
          DAPR_TAG: ${{ steps.tag.outputs.version }}
        run: make docker-push

  publish:
    name: Create multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create multi-arch manifests
        env:
          DAPR_REGISTRY: ghcr.io/${{ github.repository_owner }}
          DAPR_TAG: ${{ steps.tag.outputs.version }}
        run: |
          # dapr (system image)
          docker manifest create \
            ${DAPR_REGISTRY}/dapr:${DAPR_TAG} \
            --amend ${DAPR_REGISTRY}/dapr:${DAPR_TAG}-linux-amd64 \
            --amend ${DAPR_REGISTRY}/dapr:${DAPR_TAG}-linux-arm64
          docker manifest push --purge ${DAPR_REGISTRY}/dapr:${DAPR_TAG}

          # daprd (sidecar image)
          docker manifest create \
            ${DAPR_REGISTRY}/daprd:${DAPR_TAG} \
            --amend ${DAPR_REGISTRY}/daprd:${DAPR_TAG}-linux-amd64 \
            --amend ${DAPR_REGISTRY}/daprd:${DAPR_TAG}-linux-arm64
          docker manifest push --purge ${DAPR_REGISTRY}/daprd:${DAPR_TAG}

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag -l 'v*-rezus.*' --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            NOTES="Initial rezus release based on upstream Dapr."
          else
            NOTES=$(git log ${PREV_TAG}..${{ steps.tag.outputs.version }} --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          body: |
            ## RezusCloud Dapr Release ${{ steps.tag.outputs.version }}

            Based on upstream [dapr/dapr](https://github.com/dapr/dapr) with native OTLP push export patches.

            ### Images
            - `ghcr.io/rezuscloud/daprd:${{ steps.tag.outputs.version }}`
            - `ghcr.io/rezuscloud/dapr:${{ steps.tag.outputs.version }}`

            ### Changes
            ${{ steps.notes.outputs.notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN }}
